<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="card">
            <div class="background">
            <div class="img">
            <img src="image-victor.jpg" alt="">
            </div>
            </div>
            <div class="card_body">
            <div class="details">
                <div class="about">
                <div class="name">Victor Crest</div>
                <div class="age">26</div>
                </div>
                <div class="address">
                    <p>London</p>
                </div>
            </div>
            <hr>
            <div class="profile_status">
                <div class="followers profile">
                    <div class="number">80k</div>
                    <div class="text">Followers</div>
                </div>
                 <div class="likes profile">
                    <div class="number">803k</div>
                    <div class="text">Likes</div>
                </div>
                 <div class="photos profile">
                    <div class="number">1.4k</div>
                    <div class="text">Photos</div>
                </div>
                </div>
            </div>
        </main>
        <footer class="attribution">
         Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
         Coded by <a href="#">Agalya</a>.
       </footer>
    </body>
</html>
